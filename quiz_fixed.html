<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập Tiếng Anh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #666;
            margin-top: 10px;
            font-size: 14px;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .question-text {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            color: #333;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
            min-height: 60px;
            display: flex;
            align-items: center;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .answer-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            background: #f8f9fa;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            transition: all 0.3s ease;
            text-align: left;
        }

        .answer-btn:hover {
            border-color: #667eea;
            background: #eef2ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .answer-btn.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .answer-btn.correct {
            border-color: #4caf50;
            background: #4caf50;
            color: white;
        }

        .answer-btn.incorrect {
            border-color: #f44336;
            background: #f44336;
            color: white;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            text-align: center;
            min-height: 20px;
        }

        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .feedback.incorrect {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .next-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-btn {
            padding: 12px 30px;
            background: #999;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #666;
            transform: translateY(-2px);
        }

        .result-container {
            text-align: center;
            padding: 40px 20px;
        }

        .result-container h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .score-percentage {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
        }

        .result-message {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .score-breakdown {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .score-breakdown p {
            margin: 8px 0;
            color: #333;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

            { question: "Question 110: They love the ___ and feel more chances", answers: ["A. excitement", "B. excite", "C. excited", "D. exciting"], correct: "A" },
            { question: "Question 111: Arrange conversation about living there", answers: ["A. a-b-c", "B. b-a-c", "C. a-c-b", "D. c-a-b"], correct: "D" },

        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let selectedAnswer = null;

        function displayQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('questionNumber').textContent = `Câu ${currentQuestion + 1}`;
            document.getElementById('questionText').textContent = question.question;
            
            const answersContainer = document.getElementById('answersContainer');
            answersContainer.innerHTML = '';
            
            question.answers.forEach((answer) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = answer;
                btn.onclick = () => selectAnswer(answer);
                answersContainer.appendChild(btn);
            });

            document.getElementById('feedback').innerHTML = '';
            document.getElementById('nextBtn').disabled = true;
            answered = false;
            selectedAnswer = null;

            updateProgress();
        }

        function selectAnswer(answer) {
    if (answered) return;

    answered = true;
    selectedAnswer = answer;
    const question = questions[currentQuestion];

    // ✅ FIX: lấy chữ A/B/C/D
    const selectedLetter = answer.charAt(0);
    const isCorrect = selectedLetter === question.correct;

    const buttons = document.querySelectorAll('.answer-btn');
    buttons.forEach((btn) => {
        btn.disabled = true;

        // ✅ highlight đáp án đúng
        if (btn.textContent.charAt(0) === question.correct) {
            btn.classList.add('correct');
        }

        // đáp án bạn chọn
        if (btn.textContent === answer) {
            btn.classList.add(isCorrect ? 'correct' : 'incorrect');
        }
    });

    const feedback = document.getElementById('feedback');
    if (isCorrect) {
        feedback.textContent = '✓ Chính xác!';
        feedback.className = 'feedback correct';
        score++;
    } else {
        feedback.textContent = `✗ Sai! Đáp án đúng là: ${question.correct}`;
        feedback.className = 'feedback incorrect';
    }

    document.getElementById('nextBtn').disabled = false;

    // AUTO NEXT CHẮC CHẮN CHẠY
    setTimeout(() => {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        displayQuestion();
    } else {
        showResults();
                        }
    }, 1500);
}

        function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        displayQuestion();
    } else {
        showResults();
    }
}

        function updateProgress() {
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Câu ${currentQuestion + 1} / ${questions.length}`;
        }

        function showResults() {
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('scoreDisplay').textContent = `${score}/${questions.length}`;
            document.getElementById('scorePercentage').textContent = `${percentage}%`;

            let message = '';
            if (percentage === 100) {
                message = '🌟 Tuyệt vời! Bạn đã trả lời hoàn hảo!';
            } else if (percentage >= 80) {
                message = '👏 Rất tốt! Bạn làm được hơn 80%!';
            } else if (percentage >= 60) {
                message = '👍 Khá tốt! Hãy tiếp tục cố gắng!';
            } else if (percentage >= 50) {
                message = '📚 Bạn cần ôn tập thêm!';
            } else {
                message = '💪 Hãy cố gắng học thêm và làm lại!';
            }

            document.getElementById('resultMessage').textContent = message;
            document.getElementById('correctCount').textContent = `✓ Đúng: ${score} câu`;
            document.getElementById('incorrectCount').textContent = `✗ Sai: ${questions.length - score} câu`;
            
            const passStatus = percentage >= 50 ? '✓ Đạt' : '✗ Không đạt';
            document.getElementById('passStatus').textContent = `Kết quả: ${passStatus}`;
        }

        document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        document.getElementById('resetBtn').addEventListener('click', () => {
            currentQuestion = 0;
            score = 0;
            answered = false;
            selectedAnswer = null;
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');
            displayQuestion();
        });

        // Khởi tạo
        displayQuestion();
    </script>
